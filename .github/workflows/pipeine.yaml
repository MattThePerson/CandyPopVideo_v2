
name: Lint & Build

on:
  push:
    branches: [main]

jobs:
  lint_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: make install-python
      - run: make build-go
      - run: make install-npm
      - run: cd frontend && npm run lint && npm run check
      - run: make build-npm

